# fly.toml app configuration file generated for campusbite on 2026-10-11T06:19:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'campusbite'
primary_region = 'sin'

[build]

[deploy]
  release_command = 'node backend/scripts/seed-admin.js'

[env]
  UPLOAD_DIR = '/data/uploads'

[[mounts]]
  source = 'db'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
